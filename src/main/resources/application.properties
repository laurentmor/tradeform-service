spring.application.name=tradeformservice
#server port for the application
server.port=9090
logging.file.name=logs/${spring.application.name}.log
logging.file.path=logs
#enable to load .env file if it exists
spring.config.import=optional:file:.env[.properties]
#driver class name for PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
#hibernate ddl-auto setting to update the database schema on startup
spring.jpa.hibernate.ddl-auto=update
#show SQL statements in the console
spring.jpa.show-sql=true
# dialect for PostgreSQLss
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# Source - https://stackoverflow.com/q/79312305
# Posted by Rebecca Zipper
# Retrieved 2026-11-10, License - CC BY-SA 4.0
#
spring.datasource.hikari.maximum-pool-size=10
# 
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.datasource.url=${datasource.url}
spring.datasource.username=${datasource.username}
spring.datasource.password=${datasource.password}
spring.profiles.active=dev
