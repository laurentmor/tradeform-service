name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Test with coverage
        run: bun run coverage

      - name: Build
        run: bun run build

      # Smoke-test the built artifact: scaffold a Java + Maven + MongoDB
      # project and verify no raw placeholder tokens or FEATURE markers leak.
      - name: Self-test — scaffold a project and verify output
        run: |
          cd /tmp
          node $GITHUB_WORKSPACE/dist/index.js smoke-app \
            --group-id com.smoke --language java --build-tool maven \
            --database mongodb --java-version 21 --license MIT \
            --author "CI" --no-install --no-git --yes
          cd smoke-app
          # no raw placeholder tokens
          count=$(grep -r '__[A-Z_]*__' . \
            --include='*.java' --include='*.xml' --include='*.yml' \
            --include='*.kts' --include='*.kt' 2>/dev/null | wc -l)
          test "$count" -eq 0 || (echo "PLACEHOLDER LEAK: $count occurrences" && exit 1)
          # no un-stripped FEATURE block markers
          count=$(grep -r '\[\[FEATURE' . \
            --include='*.java' --include='*.xml' --include='*.yml' 2>/dev/null | wc -l)
          test "$count" -eq 0 || (echo "FEATURE MARKER LEAK: $count occurrences" && exit 1)
          # correct package path exists
          test -f src/main/java/com/smoke/smokeapp/SmokeAppApplication.java \
            || (echo "Main class missing" && exit 1)
          echo "Self-test passed"

  reuse-compliance:
    name: REUSE / SPDX compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v4
